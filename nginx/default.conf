# ============================================================
# Nginx reverse proxy configuration
# Serves the React frontend and proxies /api/* to the backend
# so NO port numbers are ever visible in the browser URL.
# ============================================================

server {
    listen 80;
    server_name localhost;

    # ── Frontend (React build) ──────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Support React Router (history API fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API proxy ───────────────────────────────────
    # All requests to /api/* are forwarded to the Node.js backend
    # and the /api prefix is stripped before forwarding.
    location /api/ {
        proxy_pass         http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Strip the /api prefix before forwarding
        rewrite ^/api/(.*)$ /$1 break;
    }

    # ── Security headers ────────────────────────────────────
    add_header X-Frame-Options      "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy      "no-referrer"  always;

    # ── Cache static assets ─────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
