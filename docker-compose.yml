
# ================================================================
# Docker Compose – Banco de Bromas
#
# Services:
#   db       – PostgreSQL with the jokes database
#   backend  – Node.js / Express API  (port 3000, NOT exposed)
#   frontend – Nginx serving React + proxying /api to backend
#
# After `docker compose up --build`:
#   → Open http://localhost in your browser
#   → No port numbers in the URL – Nginx handles everything on :80
# ================================================================

services:

  # ── Database ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: "12345"
      POSTGRES_DB:       all_jokes
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Este script se ejecuta automáticamente la PRIMERA vez que arranca el contenedor.
      # Crea la tabla jokes y carga las 100 bromas.
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend ───────────────────────────────────────────────────
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PGUSER:     postgres
      PGPASSWORD: "12345"
      PGHOST:     db
      PGDATABASE: all_jokes
      PGPORT:     "5432"
    depends_on:
      db:
        condition: service_healthy
    # Port 3000 is intentionally NOT published to the host.
    # Nginx reaches it through the internal Docker network.

  # ── Nginx (Frontend + Reverse Proxy) ─────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"      # Only this port is exposed to the host
    volumes:
      # Mount the React build (run `npm run build` first or use frontend image)
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pg_data:
